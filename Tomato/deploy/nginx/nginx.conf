# ==============================================================================
# Enterprise Production Nginx Reverse Proxy Configuration for Tomato Platform
# Features:
# - Microsecond Zero-Copy Static File Serving
# - Cloaks Backend Origin (Node.js Port 5050 hidden from public internet)
# - HTTP/2 & HTTP/3 Ready TLS Hardening (A+ SSL Labs profile)
# - Rate Limiting & Connection Flooding Shields (DDoS Mitigation)
# - WebSocket Proxying with Transparent HTTP 101 Upgrade
# - Strict Proxy Header Sanitization (X-Forwarded-For, X-Real-IP, X-Forwarded-Proto)
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. Performance & Zero-Copy File Streaming
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off; # Strip Nginx version from Server header

    # 2. Buffer Overflow & Request Flood Protections
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # 3. Aggressive Slowloris & Idle Connection Timeouts
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # 4. Gzip Compression for Optimal Web Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 5. Rate Limiting Zones (DDoS & Brute Force Defense)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 6. WebSocket Protocol Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 7. Backend Upstream Definition with Persistent Keepalive Pool
    upstream tomato_backend {
        server auth:5050;
        # Failover / health detection
        server 127.0.0.1:5050 backup;
        keepalive 64;
    }

    # ==========================================================================
    # HTTP -> HTTPS Redirect Server (Port 80)
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME Challenge for Let's Encrypt SSL Certificates
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Enforce HTTPS redirect for all incoming cleartext traffic
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # Secure HTTPS Reverse Proxy Server (Port 443)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost;

        # TLS Certificates (Place valid certificates in /etc/nginx/certs/)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS Profile (Strict TLS 1.2 & TLS 1.3 only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Defensive Enterprise Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

        # Connection Limit: Max 30 simultaneous connections per IP
        limit_conn conn_limit 30;

        # ----------------------------------------------------------------------
        # Block Sensitive Hidden Files & Exploitation Scanners
        # ----------------------------------------------------------------------
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* (\.git|\.env|\.sql|\.bak|\.config)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ----------------------------------------------------------------------
        # Reverse Proxy: REST APIs -> Node.js Backend (Port 5050)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://tomato_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Trusted Proxy Header Propagation
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Buffering and timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }

        # Rate Limit Login & Authentication specifically (Brute force shield)
        location ~* ^/api/auth/(login|register|password-reset) {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://tomato_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # Reverse Proxy: WebSocket Gateway (ws:// & wss://)
        # ----------------------------------------------------------------------
        location /ws {
            proxy_pass http://tomato_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ----------------------------------------------------------------------
        # Reverse Proxy: Static Uploads & Media
        # ----------------------------------------------------------------------
        location /uploads/ {
            proxy_pass http://tomato_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # ----------------------------------------------------------------------
        # Direct Frontend Static Delivery (Zero-Copy with Client Caching)
        # ----------------------------------------------------------------------
        location / {
            root /var/www/tomato/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 7d;
                add_header Cache-Control "public, max-age=604800, immutable";
                access_log off;
            }
        }
    }
}

